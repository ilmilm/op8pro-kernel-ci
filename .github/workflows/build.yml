name: build-op8pro-kernel

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  KERNEL_REPO: OnePlusOSS/android_kernel_oneplus_sm8250
  KERNEL_BRANCH: oneplus/sm8250_t_13.1_op8
  DT_REPO: OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8250
  CLANG_MIRROR: AOSP-11/prebuilts_clang_host_linux-x86_clang-r399163b
  AK3_REPO: osm0sis/AnyKernel3
  # Kernel is cloned to kernel/sm8250 so that the AOSP-style layout matches the
  # git symlinks in the tree: all 85 external symlinks resolve to a vendor/
  # directory two levels ABOVE the kernel repo root (i.e. <workspace>/vendor).
  KDIR: kernel/sm8250
  # Oplus feature make variables: the Android build system normally passes
  # these into the kernel make (OplusKernelEnvConfig.mk only injects the CPP
  # -D macros; the obj gating in subsystem Makefiles is done via these make
  # vars). Call sites are compiled unconditionally (macros are always on), so
  # the implementations below MUST be built or vmlinux fails to link.
  OPLUS_FEATURES: >-
    OPLUS_FEATURE_UFSPLUS=yes
    OPLUS_FEATURE_UFS_SHOW_LATENCY=yes
    OPLUS_FEATURE_PADL_STATISTICS=yes
    OPLUS_FEATURE_WIFI_ROUTERBOOST=yes
    OPLUS_FEATURE_PROCESS_RECLAIM=yes
    OPLUS_FEATURE_MEMLEAK_DETECT=yes

jobs:
  build:
    name: kona-perf Image + dtb.img + AnyKernel3
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          echo "--- after cleanup ---"
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev cpio kmod \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      # Check out this CI repo (provides ak3/anykernel.sh and docs)
      - name: Checkout CI repo
        uses: actions/checkout@v4
        with:
          path: ci

      - name: Clone kernel source
        run: |
          git clone --depth=1 --single-branch \
            --branch "$KERNEL_BRANCH" \
            "https://github.com/$KERNEL_REPO" "$KDIR"
          echo "kernel HEAD: $(git -C "$KDIR" rev-parse HEAD)"
          test -f "$KDIR/arch/arm64/configs/vendor/kona-perf_defconfig"
          # dt vendor entry is a git symlink (dangling until vendor tree is
          # placed two levels up), so use readlink, not cat
          readlink "$KDIR/arch/arm64/boot/dts/vendor"

      - name: Place devicetree + oplus vendor sources
        run: |
          git clone --depth=1 --single-branch \
            --branch "$KERNEL_BRANCH" \
            "https://github.com/$DT_REPO" dtrepo
          # vendor/ must live two levels above the kernel root to satisfy the
          # ~85 git symlinks pointing at ../../../../vendor/... etc.
          mkdir -p vendor
          cp -a dtrepo/vendor/. vendor/
          test -f vendor/qcom/proprietary/devicetree-4.19/qcom/kona.dts
          test -f vendor/qcom/proprietary/devicetree-4.19/Makefile
          test -d vendor/oplus/kernel/oplus_performance/sched_assist
          # techpack/{camera,display,video} gitlink sources live in the dt
          # repo under kernel/msm-4.19/techpack/. techpack/display is required
          # at vmlinux link time (msm_drm_register_client et al. are called by
          # built-in touchpanel/fingerprint/charger drivers); camera and video
          # build nothing with kona-perf_defconfig but must exist as dirs.
          cp -a dtrepo/kernel/msm-4.19/techpack/. "$KDIR/techpack/"
          test -f "$KDIR/techpack/display/Makefile"
          test -f "$KDIR/techpack/display/msm/msm_atomic.c"
          # Activate the oplus display glue: the dt-repo snapshot ships it
          # disabled (oplus/Makefile renamed to Makefile_back and the
          # obj-$(CONFIG_DRM_OPLUS) line commented out), but the stock kernel
          # links oplus_adfr_* / msm_drm_* from it (konadisp.conf exports
          # CONFIG_DRM_OPLUS=y unconditionally).
          if [ -f "$KDIR/techpack/display/oplus/Makefile_back" ] && [ ! -f "$KDIR/techpack/display/oplus/Makefile" ]; then
            cp "$KDIR/techpack/display/oplus/Makefile_back" "$KDIR/techpack/display/oplus/Makefile"
          fi
          # build oplus_adfr.o unconditionally (stock gates it on
          # OPLUS_FEATURE_ADFR_KERNEL which the Android build sets) - keep the
          # ifeq/endif pairing intact by making the condition a tautology
          sed -i 's|^ifeq (\$(OPLUS_FEATURE_ADFR_KERNEL),yes)$|ifeq (y,y)|' \
            "$KDIR/techpack/display/oplus/Makefile"
          # oplus_display_panel_cabc.o is only referenced by the msm_drm
          # composite block that was removed above; add it to this list
          sed -i 's|^obj-\$(CONFIG_DRM_OPLUS) += oplus_adfr.o$|obj-\$(CONFIG_DRM_OPLUS) += oplus_adfr.o oplus_display_panel_cabc.o|' \
            "$KDIR/techpack/display/oplus/Makefile"
          grep -n "oplus_adfr.o\|panel_cabc" "$KDIR/techpack/display/oplus/Makefile"
          sed -i 's|^#obj-\$(CONFIG_DRM_OPLUS) += oplus/|obj-\$(CONFIG_DRM_OPLUS) += oplus/|' "$KDIR/techpack/display/Makefile"
          grep -n "CONFIG_DRM_OPLUS" "$KDIR/techpack/display/Makefile"
          # Remove the ../oplus objects from the msm_drm composite in
          # msm/Makefile - otherwise the same sources are linked twice
          # (oplus/built-in.a AND msm_drm.o) and vmlinux fails with
          # multiple-definition errors.
          sed -i '/^msm_drm-\$(CONFIG_DRM_OPLUS) += \.\.\/oplus\//,+12d' "$KDIR/techpack/display/msm/Makefile"
          sed -i '/^ifeq (\$(OPLUS_FEATURE_ADFR_KERNEL),yes)$/,+2d' "$KDIR/techpack/display/msm/Makefile"
          grep -c '\.\./oplus/' "$KDIR/techpack/display/msm/Makefile" || true
          # vmlinux.lds.S places .bss.rtic in a second .bss output section
          # AFTER _end; old Android binutils tolerated it, ld >= 2.4x places
          # it beyond ADR_PREL reach of .text ("relocation truncated to fit").
          # Rewrite deterministically with python3: inline BSS_SECTION with
          # *(.bss.rtic) inside the zero-cleared range, drop the extra block.
          python3 - "$KDIR/arch/arm64/kernel/vmlinux.lds.S" <<'PYEOF'
import re, sys
p = sys.argv[1]
s = open(p).read()
inline = """\t. = ALIGN(0);
\t__sbss_start = .;
\t*(.sbss)
\t*(.sbss.*)
\t__bss_start = .;
\t. = ALIGN(PAGE_SIZE);
\t*(.bss.rtic)
\t. = ALIGN(PAGE_SIZE);
\t*(.bss)
\t*(.bss.*)
\t*(COMMON)
\t__bss_stop = .;"""
s2, n1 = re.subn(r"\tBSS_SECTION\(0, 0, 0\)\n", inline + "\n", s)
s3, n2 = re.subn(r"\n\t\.bss : \{[^\n]*bss segment[^\n]*\n[^\n]*RTIC_BSS[^\n]*\n\t\}", "", s2)
open(p, "w").write(s3)
print("BSS_SECTION replaced:", n1, "| second .bss block removed:", n2)
assert n1 == 1 and n2 == 1, "lds edit did not apply exactly once"
PYEOF
grep -n "bss.rtic\|__bss_start\|__bss_stop" "$KDIR/arch/arm64/kernel/vmlinux.lds.S"
          rm -rf dtrepo
          # Compiled oplus charger code reaches the QC power-supply headers via
          # quoted includes like "../../../../kernel/msm-4.19/drivers/power/
          # supply/qcom/storm-watch.h" (logical kernel-view resolution). The
          # internal manifest provides <aosp>/kernel/msm-4.19 (QC kernel tree);
          # all referenced headers exist in our kernel tree, so symlink it.
          mkdir -p kernel
          ln -sfn ../kernel/sm8250 kernel/msm-4.19
          ln -sfn ../kernel/sm8250 kernel/msm-4.14
          ln -sfn ../kernel/sm8250 kernel/msm-4.9
          ls -la kernel/
          echo "vendor tree placed at $(pwd)/vendor"
          cd "$KDIR"
          git ls-tree -r HEAD | awk '$1=="120000"{print $4}' | while read -r p; do
            t=$(git cat-file blob "HEAD:$p")
            d=$(dirname "$p")
            [ -e "$d/$t" ] || echo "DANGLING: $p -> $t"
          done | tee /tmp/dangling.txt
          if [ -s /tmp/dangling.txt ]; then
            echo "::error::Dangling symlinks remain (see list above)"
            exit 1
          fi
          echo "all git symlinks resolve"

      - name: Install clang r399163b
        run: |
          git clone --depth=1 \
            "https://github.com/$CLANG_MIRROR" \
            "$KDIR/prebuilts-master/clang/host/linux-x86/clang-r399163b"
          "$KDIR/prebuilts-master/clang/host/linux-x86/clang-r399163b/bin/clang" --version

      - name: Configure kernel (vendor/kona-perf_defconfig)
        working-directory: kernel/sm8250
        run: |
          export PATH="$PWD/prebuilts-master/clang/host/linux-x86/clang-r399163b/bin:$PATH"
          # CC=clang (command-line) bypasses scripts/gcc-wrapper.py (python2-only).
          # BRAND_SHOW_FLAG=oneplus selects the OnePlus sm8250 panel dirs in
          # vendor/qcom/proprietary/devicetree-4.19/Makefile.
          # $OPLUS_FEATURES enables the make-gated oplus feature objects.
          make O=out ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            BRAND_SHOW_FLAG=oneplus \
            $OPLUS_FEATURES \
            vendor/kona-perf_defconfig
          make O=out ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            BRAND_SHOW_FLAG=oneplus \
            $OPLUS_FEATURES \
            olddefconfig
          echo "--- key config ---"
          grep -E "^CONFIG_(ARCH_KONA|ARCH_QCOM|LOCALVERSION|MODVERSIONS|MODULE_SIG|PREEMPT|SMP|BUILD_ARM64_UNCOMPRESSED_KERNEL)" out/.config
          grep -E "FSA4480" out/.config || true

      - name: Build Image.gz, dtbs, modules
        working-directory: kernel/sm8250
        shell: bash
        run: |
          export PATH="$PWD/prebuilts-master/clang/host/linux-x86/clang-r399163b/bin:$PATH"
          # Stock code was built with older sdclang; clang 11 is stricter.
          # Downgrade the tree's -Werror= diagnostic classes to plain warnings
          # (same policy classes as Makefile lines 1041-1049).
          export KCFLAGS="-Wno-error=strict-prototypes -Wno-error=implicit-int -Wno-error=date-time -Wno-error=incompatible-pointer-types"
          make O=out ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            BRAND_SHOW_FLAG=oneplus \
            $OPLUS_FEATURES \
            -j"$(nproc)" \
            Image.gz dtbs modules 2>&1 | tee build.log
          df -h

      - name: Assemble dtb.img and verify release/vermagic
        working-directory: kernel/sm8250
        run: |
          # Same recipe as AndroidKernel.mk line 211
          cat out/arch/arm64/boot/dts/vendor/*/*.dtb > out/dtb.img
          echo "=== artifacts ==="
          file out/arch/arm64/boot/Image
          ls -la out/arch/arm64/boot/Image out/arch/arm64/boot/Image.gz out/dtb.img
          echo "=== UTS_RELEASE ==="
          cat out/include/generated/utsrelease.h
          echo "=== Linux version banner in vmlinux ==="
          strings out/vmlinux | grep -m1 "Linux version" || echo "WARN: banner not found"
          MOD=$(find out -name '*.ko' | head -1)
          echo "=== vermagic (ground truth from module: $MOD) ==="
          modinfo -F vermagic "$MOD"

      - name: Package AnyKernel3 zip
        run: |
          git clone --depth=1 "https://github.com/$AK3_REPO" ak3
          cp ci/ak3/anykernel.sh ak3/anykernel.sh
          cp "$KDIR/out/arch/arm64/boot/Image" ak3/Image
          cp "$KDIR/out/dtb.img" ak3/dtb.img
          cp ci/ak3/README-FLASH.txt ak3/README.txt
          sha=${GITHUB_SHA::7}
          ( cd ak3 && zip -r9 "../OnePlus8Pro-kernel-4.19.157-perf-$sha.zip" \
              anykernel.sh Image dtb.img README.txt )
          ls -la OnePlus8Pro-kernel-*.zip

      - name: sha256 of artifacts
        run: |
          sha256sum \
            "$KDIR/out/arch/arm64/boot/Image" \
            "$KDIR/out/arch/arm64/boot/Image.gz" \
            "$KDIR/out/dtb.img" \
            OnePlus8Pro-kernel-*.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: op8pro-kernel-${{ github.sha }}
          if-no-files-found: error
          path: |
            kernel/sm8250/out/arch/arm64/boot/Image
            kernel/sm8250/out/arch/arm64/boot/Image.gz
            kernel/sm8250/out/dtb.img
            kernel/sm8250/out/.config
            kernel/sm8250/build.log
            OnePlus8Pro-kernel-*.zip
